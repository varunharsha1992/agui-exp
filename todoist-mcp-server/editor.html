<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Todoist Plan Editor</title>
</head>
<body>
  <main class="main">
    <div id="loading" class="loading">
      <p>Loading plan...</p>
    </div>
    <div id="editor" class="editor" style="display: none;">
      <div class="editor-header">
        <h2 id="project-title">Plan</h2>
        <div class="editor-actions">
          <button id="refresh-btn" class="btn btn-secondary">Refresh</button>
          <button id="save-btn" class="btn btn-primary">Save to Todoist</button>
        </div>
      </div>
      <div id="sections" class="sections"></div>
      <div id="status-bar" class="status-bar"></div>
    </div>
    <div id="error" class="error-banner" style="display: none;">
      <p id="error-message"></p>
      <button id="retry-btn" class="btn btn-secondary">Retry</button>
    </div>
  </main>
  <script type="module" src="/src/editor.ts"></script>
</body>
</html>
